<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flashcard Quiz App</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5fb;
            color: #222;
        }

        header {
            background: #4f46e5;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #00000012;
            text-align: center;
        }

        .counter {
            color: #666;
            margin-bottom: 20px;
        }

        .question {
            font-size: 24px;
            min-height: 70px;
            overflow-wrap: anywhere;
        }

        .answer {
            background: #eef2ff;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            overflow-wrap: anywhere;
        }

        button {
            padding: 11px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            margin: 5px;
        }

        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible {
            outline: 3px solid #a5b4fc;
            outline-offset: 2px;
        }

        .primary {
            background: #4f46e5;
            color: white;
        }

        .secondary {
            background: #e5e7eb;
            color: #222;
        }

        .danger {
            background: #fee2e2;
            color: #b91c1c;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .navigation {
            margin-top: 15px;
        }

        .form-card {
            margin-top: 25px;
            text-align: left;
        }

        .form-card h2 {
            text-align: center;
        }

        label {
            display: block;
            margin: 15px 0 6px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-buttons {
            text-align: center;
            margin-top: 15px;
        }

        .empty {
            color: #666;
            padding: 20px 0;
        }

        .status {
            text-align: center;
            color: #166534;
            min-height: 20px;
            margin-top: 10px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        @media (max-width: 480px) {
            .container {
                width: 94%;
                margin: 18px auto;
            }

            .card {
                padding: 20px 14px;
            }

            .question {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>📚 Flashcard Quiz App</h1>
        <p>Learn, Practice and Remember!</p>
    </header>

    <main class="container">

        <!-- Flashcard display -->
        <section class="card" aria-label="Flashcard">

            <div id="counter" class="counter"></div>

            <h2 id="question" class="question"></h2>

            <div id="answer" class="answer" hidden>
                <strong>Answer:</strong>
                <p id="answerText"></p>
            </div>

            <button
                type="button"
                id="showAnswer"
                class="primary"
                onclick="toggleAnswer()">
                Show Answer
            </button>

            <div class="navigation">
                <button
                    type="button"
                    id="previousBtn"
                    class="secondary"
                    onclick="previousCard()">
                    ← Previous
                </button>

                <button
                    type="button"
                    id="nextBtn"
                    class="secondary"
                    onclick="nextCard()">
                    Next →
                </button>
            </div>

            <div>
                <button
                    type="button"
                    id="editBtn"
                    class="primary"
                    onclick="editCard()">
                    Edit Card
                </button>

                <button
                    type="button"
                    id="deleteBtn"
                    class="danger"
                    onclick="deleteCard()">
                    Delete Card
                </button>
            </div>

        </section>

        <!-- Add or edit form -->
        <section class="card form-card">

            <h2 id="formTitle">Add a Flashcard</h2>

            <form id="cardForm">

                <label for="questionInput">Question</label>

                <textarea
                    id="questionInput"
                    placeholder="Enter your question..."
                    required
                    maxlength="500"></textarea>

                <label for="answerInput">Answer</label>

                <textarea
                    id="answerInput"
                    placeholder="Enter the answer..."
                    required
                    maxlength="1000"></textarea>

                <div class="form-buttons">
                    <button
                        type="submit"
                        id="saveBtn"
                        class="primary">
                        Add Flashcard
                    </button>

                    <button
                        type="button"
                        id="cancelBtn"
                        class="secondary"
                        onclick="cancelEdit()"
                        hidden>
                        Cancel
                    </button>
                </div>

            </form>

            <p id="status" class="status" role="status"
               aria-live="polite"></p>

        </section>

    </main>

    <footer>
        <p>Flashcard Quiz App | Keep Learning!</p>
    </footer>

    <script>
        const starterCards = [
            {
                question: "What is HTML?",
                answer: "HTML stands for HyperText Markup Language."
            },
            {
                question: "What is CSS?",
                answer: "CSS stands for Cascading Style Sheets."
            },
            {
                question: "What is JavaScript?",
                answer: "JavaScript is a programming language used to add interactivity to websites."
            }
        ];

        function loadCards() {
            try {
                const saved = localStorage.getItem("flashcards");

                if (saved === null) {
                    return starterCards.map(card => ({ ...card }));
                }

                const parsed = JSON.parse(saved);

                if (
                    !Array.isArray(parsed) ||
                    !parsed.every(card =>
                        card &&
                        typeof card.question === "string" &&
                        typeof card.answer === "string"
                    )
                ) {
                    return starterCards.map(card => ({ ...card }));
                }

                return parsed;
            } catch (error) {
                return starterCards.map(card => ({ ...card }));
            }
        }

        let flashcards = loadCards();
        let currentIndex = 0;
        let isEditing = false;
        let answerVisible = false;

        const questionElement =
            document.getElementById("question");

        const answerElement =
            document.getElementById("answer");

        const answerText =
            document.getElementById("answerText");

        const counterElement =
            document.getElementById("counter");

        const showAnswerButton =
            document.getElementById("showAnswer");

        const previousButton =
            document.getElementById("previousBtn");

        const nextButton =
            document.getElementById("nextBtn");

        const editButton =
            document.getElementById("editBtn");

        const deleteButton =
            document.getElementById("deleteBtn");

        const cardForm =
            document.getElementById("cardForm");

        const questionInput =
            document.getElementById("questionInput");

        const answerInput =
            document.getElementById("answerInput");

        const formTitle =
            document.getElementById("formTitle");

        const saveButton =
            document.getElementById("saveBtn");

        const cancelButton =
            document.getElementById("cancelBtn");

        const statusElement =
            document.getElementById("status");

        function saveCards() {
            try {
                localStorage.setItem(
                    "flashcards",
                    JSON.stringify(flashcards)
                );
                return true;
            } catch (error) {
                showStatus("Could not save cards in this browser.");
                return false;
            }
        }

        function showStatus(message) {
            statusElement.textContent = message;
        }

        function renderCard() {
            const hasCards = flashcards.length > 0;

            counterElement.textContent = hasCards
                ? `Card ${currentIndex + 1} of ${flashcards.length}`
                : "No flashcards available";

            questionElement.textContent = hasCards
                ? flashcards[currentIndex].question
                : "Add your first flashcard to begin!";

            answerText.textContent = hasCards
                ? flashcards[currentIndex].answer
                : "";

            answerElement.hidden = !hasCards || !answerVisible;

            showAnswerButton.textContent = answerVisible
                ? "Hide Answer"
                : "Show Answer";

            showAnswerButton.disabled = !hasCards;
            previousButton.disabled =
                !hasCards || currentIndex === 0;

            nextButton.disabled =
                !hasCards || currentIndex === flashcards.length - 1;

            editButton.disabled = !hasCards;
            deleteButton.disabled = !hasCards;
        }

        function toggleAnswer() {
            if (flashcards.length === 0) return;

            answerVisible = !answerVisible;
            renderCard();
        }

        function nextCard() {
            if (currentIndex < flashcards.length - 1) {
                currentIndex++;
                answerVisible = false;
                renderCard();
            }
        }

        function previousCard() {
            if (currentIndex > 0) {
                currentIndex--;
                answerVisible = false;
                renderCard();
            }
        }

        function resetForm() {
            cardForm.reset();
            isEditing = false;

            formTitle.textContent = "Add a Flashcard";
            saveButton.textContent = "Add Flashcard";
            cancelButton.hidden = true;
        }

        function cancelEdit() {
            resetForm();
            showStatus("");
        }

        function editCard() {
            if (flashcards.length === 0) return;

            isEditing = true;

            questionInput.value =
                flashcards[currentIndex].question;

            answerInput.value =
                flashcards[currentIndex].answer;

            formTitle.textContent = "Edit Flashcard";
            saveButton.textContent = "Save Changes";
            cancelButton.hidden = false;

            showStatus("Update the question or answer below.");

            questionInput.focus();

            document.querySelector(".form-card").scrollIntoView({
                behavior: "smooth",
                block: "start"
            });
        }

        function deleteCard() {
            if (flashcards.length === 0) return;

            const confirmed = confirm(
                "Are you sure you want to delete this flashcard?"
            );

            if (!confirmed) return;

            const deletedCard = flashcards[currentIndex];

            flashcards.splice(currentIndex, 1);

            if (currentIndex >= flashcards.length) {
                currentIndex = Math.max(0, flashcards.length - 1);
            }

            answerVisible = false;
            resetForm();

            if (saveCards()) {
                showStatus("Flashcard deleted successfully.");
            }

            renderCard();
        }

        cardForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const question = questionInput.value.trim();
            const answer = answerInput.value.trim();

            if (!question || !answer) {
                showStatus("Please enter both a question and an answer.");
                return;
            }

            const previousCards = flashcards.map(card => ({ ...card }));
            const previousIndex = currentIndex;

            if (isEditing) {
                flashcards[currentIndex] = {
                    question: question,
                    answer: answer
                };

                answerVisible = false;
            } else {
                flashcards.push({
                    question: question,
                    answer: answer
                });

                currentIndex = flashcards.length - 1;
                answerVisible = false;
            }

            if (!saveCards()) {
                flashcards = previousCards;
                currentIndex = previousIndex;
                renderCard();
                return;
            }

            const message = isEditing
                ? "Flashcard updated successfully!"
                : "Flashcard added successfully!";

            resetForm();
            renderCard();
            showStatus(message);
        });

        renderCard();
    </script>

</body>
</html>
